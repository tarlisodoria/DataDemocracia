name: Dados · votações da Câmara

# Recoleta as votações nominais do Plenário e abre um commit se algo mudou.
on:
  workflow_dispatch:
    inputs:
      ano:
        description: Ano das votações
        default: "2025"
  schedule:
    - cron: "17 9 1 * *" # dia 1 de cada mês, 06:17 em Brasília

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Coletar na API da Câmara
        run: node scripts/coletar-votacoes-camara.mjs ${{ inputs.ano || '2025' }}
      - name: Registrar mudanças
        run: |
          if git diff --quiet -- client/public/explorar/dados; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/explorar/dados
          git commit -m "Atualiza dados de votações da Câmara (${{ inputs.ano || '2025' }})"
          git push
